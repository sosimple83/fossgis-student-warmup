version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: hack4gdi_postgis
    environment:
      POSTGRES_DB: hackathon_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: hack4gdi_app
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/hackathon_db
    volumes:
      - ./app:/app
      - ./data:/data
    depends_on:
      - db

volumes:
  postgis_data: